name: RhyGaze
description: 'RhyGaze is a clinical-stage biotechnology company developing gene therapy
  treatments to restore vision for people with retinal degenerative diseases. Its platform
  combines optogenetic proteins that engineer photosensitivity into mammalian cells with
  gene therapy delivery tools that install light-sensing machinery into human eye cells,
  technology originating at the Institute of Molecular and Clinical Ophthalmology Basel (IOB)
  in Switzerland. The team includes executives who helped develop and commercialize Luxturna,
  the first FDA-approved gene therapy for a genetic disease. RhyGaze operates from Basel,
  Switzerland and Philadelphia, Pennsylvania, and is backed by GV. As a therapeutics company
  it publishes no public developer API surface.'
